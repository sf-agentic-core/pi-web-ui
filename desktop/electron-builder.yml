# electron-builder 配置（桌面版专用，网页版/npm 包不受影响）
appId: com.xingshuyin.pi-web-ui-desktop
productName: pi-web-ui-desktop
directories:
  output: release
files:
  - dist/desktop
  - dist/server
  - web/dist
  - themes
  - package.json
# 仓库 package.json 的 main 是 CLI（bin/pi-web-ui.mjs，桌面包不带它，也不该拿它当入口）：
# 不改这一行 electron-builder 会以它做 sanity check → 直接报 entry file does not exist。
extraMetadata:
  main: dist/desktop/main.js
# asar:false：server 以 ELECTRON_RUN_AS_NODE 跑在纯 Node 语义下，
# 且 node-pty 的 .node 原生模块本来就进不了 asar，直接关闭最省心。
asar: false
# 关掉 electron-builder 的 @electron/rebuild：node-pty 1.1.0 是 N-API 预编译
# （prebuilds/，在 ELECTRON_RUN_AS_NODE 下实测 require 成功，ABI 141/149 通吃），
# 不需要按 Electron ABI 重编；否则打包时会强依赖本机 Visual Studio（node-gyp）。
npmRebuild: false
# 图标：直接复用网页版的 PWA 图标（1024×1024 PNG，electron-builder 自己转 .ico/.icns）。
# 不放进 files：图标是打包时烘进 exe/App 里的，运行时不需要这个文件。
win:
  target: nsis
  icon: web/public/icons/icon-1024.png
mac:
  target: dmg
  icon: web/public/icons/icon-1024.png
linux:
  target: AppImage
  icon: web/public/icons/icon-1024.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# 签名：不写死任何证书路径——electron-builder 认 CSC_LINK + CSC_KEY_PASSWORD 环境变量，
# 有证书时自动签（含 mac 的 .p12），没有就出未签名包（Windows SmartScreen 会提示未知发布者）。
# 详见 desktop/README.md「签名」。
