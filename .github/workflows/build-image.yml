# ==============================================================================
# Build & push de la imagen de pi-web-ui
# ==============================================================================
# Deriva de `agent-base` (repo tachikoma), que es donde vive el toolchain, los
# 8 MCPs y Chromium. Aquí solo se añade la app web.
#
# ⚠️ `AGENT_BASE_TAG` es un PIN explícito: para adoptar una base nueva hay que
# cambiarlo aquí. Es la contrapartida consciente de tener una base compartida en
# otro repo — y evita que un cambio de base rompa esta imagen sin que nadie lo vea.
#
# linux/amd64: el clúster es x86_64 (el build local del VPS es ARM64).
# ==============================================================================
name: Build image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "server/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: rg.fr-par.scw.cloud
  NAMESPACE: sf-agentic-core
  # Pin de la base compartida. Actualizar al adoptar una base nueva.
  # 5f0c7e44 = merge de tachikoma#48: instalación determinista de los servidores
  # MCP (un `npm install` por paquete, sin `|| true`) + el puente de variables
  # de entorno + google-suite-verify. La base anterior (7499be30) NO traía
  # google-workspace-mcp: la instalación de siete paquetes en una sola línea
  # abortaba entera por un pin inexistente y `|| true` lo ocultaba.
  #
  # db45d82b = merge de tachikoma#61: pi 0.86.1 -> 0.87.0, pi-mcp-adapter
  # 2.34.0 -> 2.36.0, google-drive-mcp 2.2.0 -> 2.11.0, uv 0.12.13 -> 0.12.17.
  # Publicada por `Build images` en main (run 35670037656, success; el tag es el
  # SHA del merge). La acompañan DOS PRs, y sin ellos queda a medias:
  #   - este repo: el pi que embebe la UI salta a ^0.87.0, o el shell y el
  #     runtime empotrado se pelean (ver el comentario en Dockerfile.agent-base).
  #   - core-gitops: los `newTag` del overlay prod apuntan a este mismo SHA, o
  #     ArgoCD sigue sirviendo la imagen anterior.
  # Ojo: pi-subagents NO sube a 0.70.1 en esa base (rompe el bot: necesita
  # símbolos de pi-ai que solo existen desde 0.86.1, y el bot corre 0.80.7).
  AGENT_BASE_TAG: "db45d82b1d6296d1e396821d3b861fb75047aad9"
  IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: build amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Preflight — secret del registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          if [ -z "${SCW_SECRET_KEY:-}" ]; then
            echo "::error::Falta el secret SCW_SECRET_KEY en este repositorio."
            echo "::error::Créalo con: gh secret set SCW_SECRET_KEY -R ${{ github.repository }}"
            exit 1
          fi
          echo "Confirmado: el secret está presente."

      - name: Login en Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build & push piweb
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/agent-base:${{ env.AGENT_BASE_TAG }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/piweb:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=piweb
          cache-to: type=gha,mode=max,scope=piweb
