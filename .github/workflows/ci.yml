name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci / npm audit hit the registry and on shared GitHub runners that
      # network is often slow/flaky — a stuck call used to hang the whole job.
      # Harden: retries + hard timeout + --no-audit --no-fund (skip advisory DB
      # and funding lookups during install).
      - name: Install dependencies (retry + timeout)
        timeout-minutes: 10
        run: |
          set -e
          for i in 1 2 3 4; do
            if timeout 200 npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci attempt $i failed — retrying…"
            sleep 15
          done
          exit 1

      # Dependabot + CodeQL already cover dependency and code security. This
      # npm audit step is best-effort: it queries the registry advisory DB,
      # which can hang/slow on shared runners, so it must never block merges.
      - name: Security audit (best-effort, non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        run: timeout 150 npm audit --audit-level=high || echo "npm audit skipped/timed out (non-blocking)"

      # 代码格式（prettier；失败先修格式：npm run format）
      - name: Check formatting
        run: npm run format:check

      # 静态检查（oxlint；失败先看报告：npm run lint）
      - name: Lint
        run: npm run lint

      # 协议双端手工同步校验（server/protocol.ts ↔ web/src/types.ts）
      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 纯函数单测（毫秒级、零 token）
      - name: Unit tests
        run: npx vitest run

      # 零 token 协议冒烟（每个测试自起隔离 server：独立端口 + 临时 data-dir）
      - name: Protocol smoke tests
        run: node tests/run-smoke.mjs
